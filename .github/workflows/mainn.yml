name: Black Duck SCA Scan

on:
  push:
    branches:
      - Polaris-testing
  workflow_dispatch:

jobs:
  blackduck:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------
      # Checkout source code
      # --------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------
      # Setup Java
      # --------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------
      # Verify Maven
      # --------------------------------------------
      - name: Verify Maven
        run: mvn -version

      # --------------------------------------------
      # Download Bridge CLI
      # --------------------------------------------
      - name: Download Bridge CLI
        run: |
          curl -fLsS -o bridge.zip \
            https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-bundle/latest/bridge-cli-bundle-linux64.zip
          unzip -q bridge.zip
          chmod +x bridge-cli-bundle-linux64/bridge-cli

      # --------------------------------------------
      # Run Black Duck SCA
      # --------------------------------------------
      - name: Run Black Duck SCA
        env:
          BD_TOKEN: ${{ secrets.BD_TOKEN }}
        run: |
          ./bridge-cli-bundle-linux64/bridge-cli --stage blackducksca \
            blackducksca.url=https://expressonboarding.app.blackduck.com \
            blackducksca.api.token=$BD_TOKEN \
            blackducksca.project.name=NodeGoat \
            blackducksca.project.version.name=main \
            blackducksca.scan.mode=INTELLIGENT \
            blackducksca.policy.check.fail.on.severities=CRITICAL,HIGH
