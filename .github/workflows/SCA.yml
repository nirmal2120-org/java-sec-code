name: Black Duck SCA Scan

on:
  push:
    branches:
      - Polaris-testing
  workflow_dispatch:

jobs:
  blackduck:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout source code
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Java (required for Detect)
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # Verify Maven
      # --------------------------------------------------
      - name: Verify Maven
        run: mvn -version

      # --------------------------------------------------
      # Build Project (recommended for Java)
      # --------------------------------------------------
      - name: Build Project
        run: mvn clean install --no-transfer-progress || true

      # --------------------------------------------------
      # Download Bridge CLI
      # --------------------------------------------------
      - name: Download Bridge CLI
        run: |
          curl -fLsS -o bridge.zip \
            https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-bundle/latest/bridge-cli-bundle-linux64.zip
          unzip -q bridge.zip
          chmod +x bridge-cli-bundle-linux64/bridge-cli

      # --------------------------------------------------
      # Run Black Duck SCA ✅ (FINAL WORKING VERSION)
      # --------------------------------------------------
      - name: Run Black Duck SCA
        env:
          BD_URL: https://expressonboarding.app.blackduck.com
          BD_TOKEN: ${{ secrets.BD_TOKEN }}
        run: |
          # ✅ Export variables inside SAME shell
          export blackducksca_url="$BD_URL"
          export blackducksca_token="$BD_TOKEN"
          export blackducksca_project_name="NodeGoat"
          export blackducksca_project_version_name="Polaris-testing"
          export blackducksca_scan_full="true"
          export blackducksca_waitForScan="true"
          export detect_search_depth="5"

          # ✅ Run Bridge CLI
          ./bridge-cli-bundle-linux64/bridge-cli --stage blackducksca
