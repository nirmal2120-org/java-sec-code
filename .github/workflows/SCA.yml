name: Black Duck SCA Scan (Bridge CLI)

on:
  push:
    branches:
      - Polaris-testing
  workflow_dispatch:

jobs:
  blackduck:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------
      # Checkout source code
      # --------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------
      # Setup Java
      # --------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------
      # Build Project (recommended for Java)
      # --------------------------------------------
      - name: Build Project
        run: mvn clean install --no-transfer-progress || true

      # --------------------------------------------
      # Download Bridge CLI
      # --------------------------------------------
      - name: Download Bridge CLI
        run: |
          curl -fLsS -o bridge.zip \
            https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-bundle/latest/bridge-cli-bundle-linux64.zip
          unzip -q bridge.zip
          chmod +x bridge-cli-bundle-linux64/bridge-cli

      # --------------------------------------------
      # Run Black Duck SCA ✅ (ENV method — WORKING)
      # --------------------------------------------
      - name: Run Black Duck SCA
        env:
          BD_URL: https://expressonboarding.app.blackduck.com
          BD_TOKEN: ${{ secrets.BD_TOKEN }}
        run: |
          blackducksca_url=$BD_URL blackducksca_token=$BD_TOKEN blackducksca_project_name=NodeGoat blackducksca_project_version_name=Polaris-testing blackducksca_scan_full=true blackducksca_waitForScan=true detect_search_depth=5 ./bridge-cli-bundle-linux64/bridge-cli --stage blackducksca
