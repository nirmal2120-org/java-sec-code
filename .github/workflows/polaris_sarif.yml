# Quickstart: Black Duck Security Scan Action with polaris
name: Polaris Security Scan
on:
  push:
    branches:
      - main
      - master
      - develop
      - stage
      - release
  pull_request:
    branches:
      - main
      - master
      - develop
      - stage
      - release
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write      # required for Code Scanning upload
  pull-requests: write        # required for PR comments

jobs:
  polaris:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Polaris Security Scan
        id: polaris-scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          ### SCANNING: Required fields
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN_NEW }}
          ### ASSESSMENT TYPES
          polaris_assessment_types: SAST,SCA
          ### SCANNING: Optional fields
          polaris_test_sast_location: hybrid
          polaris_test_sca_location: hybrid
          ### SARIF report generation
          polaris_reports_sarif_create: true
          polaris_reports_sarif_file_path: ${{ github.workspace }}/.blackduck/integrations/polaris/sarif/report.sarif.json
          polaris_reports_sarif_groupSCAIssues: true
          # polaris_reports_sarif_severities: 'CRITICAL,HIGH'
          # polaris_reports_sarif_issue_types: 'SAST,SCA'
          ### Upload SARIF to GitHub Code Scanning (handled by the action)
          polaris_upload_sarif_report: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ### Configuration if Bridge diagnostic files needs to be uploaded
          include_diagnostics: true

      - name: Upload SARIF as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polaris-sarif-report
          path: .blackduck/integrations/polaris/sarif/report.sarif.json
          if-no-files-found: warn

      - name: Print findings in the log
        if: always()
        run: |
          F=.blackduck/integrations/polaris/sarif/report.sarif.json
          if [ -f "$F" ]; then
            echo "Total findings: $(jq '[.runs[].results[]] | length' $F)"
            jq -r '.runs[].results[] |
              "[\(.level // "note")] \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // 0) | \(.message.text)"' $F
          else
            echo "No SARIF report found."
          fi
